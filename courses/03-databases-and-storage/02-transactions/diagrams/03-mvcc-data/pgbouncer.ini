[databases]
postgres = host=127.0.0.1 port=55433 dbname=postgres user=postgres password=pw
[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 56432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 2
max_client_conn = 100
ignore_startup_parameters = extra_float_digits
